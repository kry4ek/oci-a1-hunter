name: hunt-a1
on:
  schedule: [ { cron: '5 * * * *' } ]
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
concurrency: { group: hunt-a1, cancel-in-progress: false }
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Hunt A1 (2 OCPU / 12 GB)
        id: launch
        shell: bash --noprofile --norc {0}
        env:
          U: ${{ secrets.OCI_CLI_USER }}
          T: ${{ secrets.OCI_CLI_TENANCY }}
          F: ${{ secrets.OCI_CLI_FINGERPRINT }}
          K: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          R: ${{ secrets.OCI_CLI_REGION }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.oci
          printf '%s\n' "$K" > ~/.oci/key.pem; chmod 600 ~/.oci/key.pem
          { echo "[DEFAULT]"; echo "user=$U"; echo "tenancy=$T"; echo "fingerprint=$F"; echo "region=$R"; echo "key_file=$HOME/.oci/key.pem"; } > ~/.oci/config
          chmod 600 ~/.oci/config
          oci iam region list >/dev/null 2>&1 || { echo "❌ auth failed"; exit 1; }
          C="$T"
          COUNT=$(oci compute instance list -c "$C" --all 2>/dev/null | jq -r '[.data[]?|select(."display-name"=="tott-web" and ."lifecycle-state"=="RUNNING")]|length' 2>/dev/null || echo 0)
          case "$COUNT" in ''|*[!0-9]*) COUNT=0 ;; esac
          if [ "$COUNT" -gt 0 ]; then echo "tott-web already RUNNING — done."; exit 0; fi
          VCN=$(oci network vcn list -c "$C" --all | jq -r '.data[]?|select(."display-name"=="tott-vcn")|.id' | head -1)
          SUBNET=$(oci network subnet list -c "$C" --vcn-id "$VCN" --all | jq -r '.data[]?|select(."prohibit-public-ip-on-vnic"==false)|.id' | head -1)
          IMAGE=$(oci compute image list -c "$C" --operating-system "Canonical Ubuntu" --operating-system-version 22.04 --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC | jq -r '.data[0].id')
          if [ -z "$SUBNET" ] || [ -z "$IMAGE" ]; then echo "config error: SUBNET/IMAGE empty"; exit 1; fi
          META=$(jq -n --arg k "$SSH_PUBLIC_KEY" '{ssh_authorized_keys:$k}')
          mapfile -t ADS < <(oci iam availability-domain list | jq -r '.data[].name')
          END=$(( $(date +%s) + 3300 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            for AD in $(printf '%s\n' "${ADS[@]}" | shuf); do
              if oci compute instance launch --availability-domain "$AD" --compartment-id "$C" \
                  --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                  --image-id "$IMAGE" --subnet-id "$SUBNET" --assign-public-ip true \
                  --display-name tott-web --metadata "$META" 2>/tmp/err; then
                echo "✅ LAUNCHED in $AD"; echo "launched=true" >> "$GITHUB_OUTPUT"; echo "ad=$AD" >> "$GITHUB_OUTPUT"; exit 0
              fi
              if grep -qiE capacity /tmp/err; then echo "$(date +%T) out of capacity in $AD";
              else echo "non-capacity error:"; cat /tmp/err; exit 1; fi
              sleep 15
            done
          done
          echo "no capacity this run; next run starts next hour"
      - name: Issue on success
        if: steps.launch.outputs.launched == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "✅ tott-web A1 launched (${{ steps.launch.outputs.ad }})" --body "Grab the public IP in OCI Compute > Instances, then disable this workflow." || true
