name: hunt-a1

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight or bounded VM search'
        type: choice
        options: [preflight, hunt]
        default: preflight
      duration_seconds:
        description: 'Total run budget, including preflight (120–720 seconds)'
        type: choice
        options: ['180', '360', '720']
        default: '180'
      allow_smaller:
        description: 'Accept one 1 OCPU / 6 GB VM if the preferred 2/12 cannot launch'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Also serialize branch tests with the existing main workflow.
concurrency:
  group: hunt-a1
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Oracle SDK
        run: python -m pip install -r requirements.txt
      - name: Preflight and bounded search
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          HUNTER_MODE: ${{ inputs.mode || 'hunt' }}
          HUNTER_DURATION: ${{ inputs.duration_seconds || '720' }}
          HUNTER_SMALLER: ${{ inputs.allow_smaller || (github.event_name == 'schedule' && vars.HUNTER_ALLOW_SMALLER == 'true') }}
        shell: bash
        run: |
          args=(--mode "$HUNTER_MODE" --duration-seconds "$HUNTER_DURATION")
          if [[ "$HUNTER_SMALLER" == "true" ]]; then args+=(--allow-smaller); fi
          python -m hunter "${args[@]}"
